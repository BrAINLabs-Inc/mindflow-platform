name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Go rewrite of backend/ (see plans/backend-go-migration.md). Needs no
  # secrets: integration tests run against a disposable Postgres via
  # testcontainers (Docker ships on ubuntu-latest), and Supabase Auth / R2 /
  # Expo push are stood in for by httptest servers.
  backend-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-v2/go.mod
          cache-dependency-path: backend-v2/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: sqlc generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          cd internal/db && "$(go env GOPATH)/bin/sqlc" diff -f sqlc.yaml
      - run: go build ./...
      - run: go test ./...

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      # Pre-existing react-hooks/purity lint errors — non-blocking until fixed.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Pre-existing lint warnings/1 error — non-blocking until fixed.
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm test -- --ci
